<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — TMG Brokerage</title>
  <meta name="description" content="Reset the password for your TMG Brokerage member account.">
  <meta property="og:title" content="Reset password — TMG Brokerage">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B1F33">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/sizes.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/easings.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/shadows.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
</head>
<body>

<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="index.html" aria-label="TMG Brokerage, home"><span class="brand-mark">TMG</span><span class="brand-word">Brokerage</span></a>
    <blockquote>Every piece authenticated. Every introduction private.</blockquote>
    <a class="back" href="index.html">Back to the site</a>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="lede">Enter the email on your membership and we'll send you a link to set a new password.</p>
      <form class="form" data-success="If an account exists for that email, a reset link is on its way. It can take a few minutes to arrive." aria-describedby="reset-status">
        <div class="field">
          <label for="reset-email">Email</label>
          <input class="input" id="reset-email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <p id="reset-status" class="form-status" role="status"></p>
      <div class="auth-links">
        <p>Remembered it? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>
</div>

</body>
</html>
