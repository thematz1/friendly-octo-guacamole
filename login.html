<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — TMG Brokerage</title>
  <meta name="description" content="Sign in to your TMG Brokerage member account.">
  <meta property="og:title" content="Sign in — TMG Brokerage">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B1F33">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@11,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/sizes.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/easings.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/shadows.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
</head>
<body>

<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="index.html" aria-label="TMG Brokerage, home"><span class="brand-mark">TMG</span><span class="brand-word">Brokerage</span></a>
    <blockquote>Every piece authenticated. Every introduction private.</blockquote>
    <a class="back" href="index.html">Back to the site</a>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Sign in</h1>
      <form class="form" data-success="Member sign-in is not open yet. Please contact your broker at contact@tmgbrokerage.com." aria-describedby="login-status">
        <div class="field">
          <label for="login-email">Email</label>
          <input class="input" id="login-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p id="login-status" class="form-status" role="status"></p>
      <div class="auth-links">
        <a href="forgot-password.html">Forgot your password?</a>
        <p>Not a member yet? <a href="register.html">Request access</a></p>
      </div>
    </div>
  </main>
</div>

</body>
</html>
