<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request access — TMG Brokerage</title>
  <meta name="description" content="Request membership to TMG Brokerage. Access is granted after a personal review.">
  <meta property="og:title" content="Request access — TMG Brokerage">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B1F33">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@11,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/sizes.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/easings.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-props@1.7.23/shadows.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
</head>
<body>

<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="index.html" aria-label="TMG Brokerage, home"><svg class="brand-seal" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23.25" fill="#0B1F33" stroke="#D4B26A" stroke-width="1.5"/><text x="24" y="30" text-anchor="middle" font-family="Bodoni Moda, Georgia, serif" font-size="16.5" font-weight="700" letter-spacing="-0.6" fill="#D4B26A">TMG</text></svg><span class="brand-text"><span class="brand-mark">TMG</span><span class="brand-word">Brokerage</span></span></a>
    <blockquote>Membership follows a personal review. We reply within 48 hours.</blockquote>
    <a class="back" href="index.html">Back to the site</a>
  </aside>

  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Request access</h1>
      <p class="lede">Tell us a little about yourself and what you collect. A broker will review your request personally.</p>
      <form class="form" data-formspree data-success="Request received. A member of our private client team will review it and contact you within 48 hours." aria-describedby="register-status">
        <input type="hidden" name="_subject" value="New access request from tmgbrokerage.com">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
        <div class="field-row">
          <div class="field">
            <label for="reg-first">First name</label>
            <input class="input" id="reg-first" name="given-name" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="reg-last">Last name</label>
            <input class="input" id="reg-last" name="family-name" type="text" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input class="input" id="reg-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="reg-phone">Phone <span class="hint">(optional)</span></label>
          <input class="input" id="reg-phone" name="tel" type="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label for="reg-interest">What do you collect?</label>
          <select class="input" id="reg-interest" name="interest">
            <option value="">Choose a category</option>
            <option value="handbags">Handbags</option>
            <option value="watches">Watches</option>
            <option value="jewelry">Jewelry</option>
            <option value="shoes">Shoes</option>
            <option value="clothing">Designer clothing</option>
            <option value="multiple">Several categories</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send request</button>
      </form>
      <p id="register-status" class="form-status" role="status"></p>
      <div class="auth-links">
        <p>Already a member? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>
</div>

</body>
</html>
